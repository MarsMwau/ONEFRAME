version: "2"
checks:
  argument-count:
    enabled: true
  complexity:
    enabled: true
  duplication:
    enabled: true
plugins:
  eslint:
    enabled: true
    channel: "eslint-8"
  stylelint:
    enabled: true
    channel: "stylelint-14"
exclude_patterns:
  - "node_modules/**"
  - "build/**"
  - "*.test.js"
  - "*.spec.js"
